<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenix Asset Studio</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#edf2f4;color:#29334a}header{padding:18px 24px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:20px;margin:0}a{color:#674d9a}main{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px;height:calc(100dvh - 65px)}aside{padding:14px;background:white;border-radius:16px;display:grid;align-content:start;gap:10px}button{border:1px solid #ded9e8;background:#faf8ff;text-align:left;padding:12px;border-radius:10px;color:#544376;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#7452ae;color:white}#stage{min-height:0;position:relative;background:#d7e7ef;border-radius:16px;overflow:hidden}#stage canvas{display:block;width:100%;height:100%;touch-action:none}#info{position:absolute;bottom:14px;left:14px;padding:10px;background:#fffffff0;border-radius:10px;pointer-events:none;font-size:13px}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{grid-template-columns:1fr 1fr;padding:8px}aside small{grid-column:1/-1}}
</style></head><body><header><h1>Phoenix Asset Studio</h1><a href="index.html">Về game</a></header><main><aside id="list"><small>Chọn model · kéo để xoay · cuộn để zoom</small></aside><section id="stage"><div id="info">Đang tải...</div></section></main>
<script src="vendor/three.bundle.js"></script><script src="assets.js"></script><script>
(()=>{const T=window.THREE,stage=document.getElementById("stage"),info=document.getElementById("info"),list=document.getElementById("list");let renderer;try{renderer=new T.WebGLRenderer({antialias:true})}catch(e){info.textContent="Thiết bị không hỗ trợ WebGL";return}renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;stage.prepend(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0xd7e7ef);scene.add(new T.HemisphereLight(0xf2f8ff,0xb0967a,2));const sun=new T.DirectionalLight(0xffecd1,3);sun.position.set(5,10,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const floor=new T.Mesh(new T.CircleGeometry(9,64),new T.MeshStandardMaterial({color:0xe9e2d5,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;floor.receiveShadow=true;scene.add(floor);const camera=new T.PerspectiveCamera(42,1,.05,100);const controls=new T.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;const assets=PhoenixAssets.create(T);let active=null,request=0;const entries=[["tree-meadow","Cây đồng cỏ",768],["cottage-lavender","Nhà mái tím",2728],["rock-moss","Đá phủ rêu",288],["phoenix-companion","Phoenix",4936]];async function select(entry,button){const ticket=++request;list.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));info.textContent="Đang tải "+entry[1];try{const model=(await assets.load(entry[0])).clone(true);if(ticket!==request)return;if(active)scene.remove(active);active=model;scene.add(model);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());model.position.set(-center.x,-box.min.y,-center.z);const d=Math.max(size.x,size.y,size.z);controls.target.set(0,size.y*.5,0);camera.position.set(d*1.2,d*.95,entry[0]==="phoenix-companion"?-d*1.8:d*1.8);controls.minDistance=d*.7;controls.maxDistance=d*5;controls.update();info.textContent=entry[1]+" · "+entry[2]+" tam giác · glTF 2.0"}catch(e){if(ticket===request)info.textContent="Không tải được model: "+entry[1]}}const buttons=entries.map(e=>{const b=document.createElement("button");b.textContent=e[1];b.setAttribute("aria-pressed","false");b.onclick=()=>select(e,b);list.append(b);return b});function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();select(entries[0],buttons[0]);renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})})();
</script></body></html>
